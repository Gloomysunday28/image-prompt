interface:
  display_name: "Image Scene Inventor"
  short_description: "按模板类型抽取视觉规格，重新发明题材，输出规格式双语 Prompt"
  default_prompt: "使用 $image-scene-inventor，选择最匹配的主模板，先判定它是环境主导、角色主导还是其他类型，保留该类型对应的视觉与技术规格，重新发明题材。不要逐行对位替换名词：结构位上至少改掉两项，数值按新构图重算，移植的每个视觉效果都要验证新载体在物理上产生得出来，正文行数不超过主模板 1.2 倍。把模板里的叙事腔调与情绪判词换成可测量的画面规定，给出中英双版完整 Prompt。"
